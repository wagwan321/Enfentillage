<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>Your order — Enfantillage</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/checkout-cart.js"></script>
  <script defer src="assets/js/order-confirmed.js"></script>
</head>
<body>
  <main class="wrap" style="max-width:760px;padding:60px 20px">
    <a href="index.html" style="font-weight:900;font-size:24px">Enfantillage</a>
    <section class="co-card" style="margin-top:28px;padding:28px;border-radius:20px;background:var(--paper,#fff)">
      <h1 id="receiptTitle">Checking your order…</h1>
      <p id="receiptMessage" role="status">Please wait while the store verifies your receipt.</p>
      <p id="receiptPayment"></p><p id="receiptCart"></p>
      <button class="btn btn--navy" id="receiptRetry" type="button" hidden>Try again</button>
      <a class="btn btn--green" href="shop.html">Continue shopping</a>
    </section>
  </main>
</body>
</html>
